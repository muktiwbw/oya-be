services:
  oya-be:
    image: ghcr.io/muktiwbw/oya-be:latest
    restart: always
    env_file:
      - .env
    networks:
      - web
      - db-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oya-be.rule=Host(`${OYA_HTTP_DOMAIN}`)"
      - "traefik.http.routers.oya-be.entrypoints=websecure"
      - "traefik.http.routers.oya-be.tls.certresolver=leresolver"
      - "traefik.http.services.oya-be.loadbalancer.server.port=${OYA_HTTP_PORT}"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - db-net
    profiles:
      - db

  migrate:
    image: gomicro/goose:latest
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: goose -dir /migrations postgres "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable" up
    networks:
      - db-net
    profiles:
      - migration

networks:
  web:
    external: true
  db-net:
    external: true
