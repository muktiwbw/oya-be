services:
  postgres:
    image: postgres:16-alpine
    container_name: oya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oya
    ports:
      - "5432:5432"
    volumes:
      - oya-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oya"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  oya-postgres-data:
