openapi: 3.0.3
info:
  title: OYA Task API
  version: 0.2.0
  description: Shared unauthenticated workspace for local or trusted internal use.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: liveness
      responses:
        "200":
          description: Process is alive; no database access required.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        "405": { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Database is available and migrations are complete.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        "503": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /version:
    get:
      operationId: version
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                type: object
                required: [service, version, commit]
                properties:
                  service: { type: string, enum: [oya] }
                  version: { type: string, example: dev }
                  commit: { type: string, example: unknown }
        "405": { $ref: "#/components/responses/Error" }
  /api/v1/tasks:
    post:
      operationId: createTask
      description: |
        Create a task. Without a key, each valid request creates a separate task.
        Generate a fresh key per intended operation and reuse it for retries.
        Matching normalized input with the same key replays the original response
        for 24 hours by default. Different input with the same key returns 409.
        Invalid input does not consume a key. Maximum body size is 65536 bytes.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Opaque client-generated token, at most 128 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 200,
                    description: Trimmed before validation; whitespace-only is invalid.,
                  }
                description: { type: string, maxLength: 2000, default: "" }
                status: { $ref: "#/components/schemas/Status" }
            example:
              { title: Prepare release notes, description: "", status: todo }
      responses:
        "201":
          description: Created task or successful replay of original creation.
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/tasks/{public_id}
            Idempotency-Replayed:
              schema: { type: string, enum: ["true"] }
              description: Present only on replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    get:
      operationId: listTasks
      description: |
        Order is created_at DESC, public_id ASC. Omit cursor for the first page.
        Resend next_cursor unchanged with the same status filter. Traversal is
        forward only and does not provide a snapshot across page requests.
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/Status" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, minLength: 1, maxLength: 2048 }
          description: Opaque URL-safe token from the preceding page.
      responses:
        "200":
          description: A page of tasks, possibly empty.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  pagination:
                    type: object
                    required: [limit, count, has_more, next_cursor]
                    properties:
                      limit: { type: integer, minimum: 1, maximum: 100 }
                      count:
                        {
                          type: integer,
                          minimum: 0,
                          description: Number returned in this page.,
                        }
                      has_more: { type: boolean }
                      next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{public_id}:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    get:
      operationId: getTask
      responses:
        "200":
          description: Task found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTask
      description: |
        Edits a task title, Markdown description source, or both. At least one editable
        field and expected_version are required. A matching no-op preserves version and
        updated_at; real changes increment version by one. Markdown rendering and HTML
        sanitization are not part of this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              minProperties: 2
              properties:
                title: { type: string, minLength: 1, maxLength: 200, description: Trimmed before validation. }
                description: { type: string, maxLength: 2000, description: Markdown source text. An empty string clears the description. }
                expected_version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Updated task, including no-op success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/tasks/{public_id}/status:
    parameters:
      - { $ref: "#/components/parameters/PublicID" }
    patch:
      operationId: updateTaskStatus
      description: |
        All transitions are allowed. No-op updates preserve version and updated_at.
        expected_version is required and is checked even for a no-op. Real changes
        increment version by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expected_version]
              properties:
                status: { $ref: "#/components/schemas/Status" }
                expected_version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Updated task, including no-op success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    PublicID:
      in: path
      name: public_id
      required: true
      schema: { type: string, format: uuid }
      description: Canonical lowercase UUIDv7; internal numeric IDs are never accepted.
  schemas:
    Status:
      type: string
      enum: [todo, doing, done]
    Task:
      type: object
      additionalProperties: false
      required:
        [public_id, title, description, status, version, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, description: Markdown source text. }
        status: { $ref: "#/components/schemas/Status" }
        version: { type: integer, format: int64, minimum: 1 }
        created_at:
          {
            type: string,
            format: date-time,
            example: "2026-10-16T10:15:30.000Z",
          }
        updated_at:
          {
            type: string,
            format: date-time,
            example: "2026-10-16T10:15:30.000Z",
          }
    TaskEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Task" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [
                  invalid_request,
                  validation_error,
                  invalid_cursor,
                  not_found,
                  method_not_allowed,
                  conflict,
                  version_conflict,
                  idempotency_key_reused,
                  request_too_large,
                  unsupported_media_type,
                  internal_error,
                  service_unavailable,
                ]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
  responses:
    Error:
      description: JSON error. SQL statements and internal errors are not exposed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
